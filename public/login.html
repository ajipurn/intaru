<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b4d46" />
    <meta name="robots" content="noindex" />
    <title>Masuk — INTARU</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Served before sign-in, so it loads nothing from the app bundle. -->
    <style>
      * { box-sizing: border-box; }
      html { height: 100%; }
      body { min-height: 100%; margin: 0; display: grid; place-items: center; padding: 24px 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #242a28; background: #f5f5f3; -webkit-font-smoothing: antialiased; }
      main { width: min(360px, 100%); background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px #14241c0d, 0 2px 5px #14241c0a, 0 8px 24px #14241c12; }
      .brand { display: flex; align-items: center; gap: 16px; padding: 18px 24px; border-bottom: 1px solid #e4e7e3; }
      .brand-name { color: #243f34; font-size: 22px; line-height: 1; font-weight: 750; letter-spacing: -.6px; }
      .brand-description { border-inline-start: 1px solid #d8ded8; padding-inline-start: 16px; font-size: 12px; font-weight: 500; line-height: 1.4; }
      .brand-description small { display: block; color: #69716d; font-size: 11px; font-weight: 400; margin-top: 2px; }
      form { display: grid; gap: 10px; padding: 20px 24px 24px; }
      h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
      label { font-size: 12px; font-weight: 500; color: #4b5450; }
      input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid #d5dbd5; border-radius: 8px; font: inherit; font-size: 16px; background: #fff; color: inherit; }
      input:focus { outline: 2px solid #24574b; outline-offset: 1px; border-color: #24574b; }
      button { height: 42px; margin-top: 6px; border: 0; border-radius: 8px; background: #24574b; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid #24574b; outline-offset: 2px; }
      .error { margin: 0; padding: 8px 10px; border-radius: 6px; background: #fdecea; color: #a1281c; font-size: 13px; }
      .error[hidden] { display: none; }
      @media (hover: hover) { button:hover { background: #1d473d; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="brand-name">INTARU</span>
        <span class="brand-description">Tata ruang<small>Kabupaten Kebumen</small></span>
      </div>
      <form method="post" action="/api/login">
        <h1>Masuk</h1>
        <p class="error" id="error" role="alert" hidden>Password salah. Coba lagi.</p>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button type="submit">Masuk</button>
      </form>
    </main>
    <script>
      if (new URLSearchParams(location.search).has("gagal")) document.getElementById("error").hidden = false;
    </script>
  </body>
</html>
